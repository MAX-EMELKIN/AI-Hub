search_prompt = ИНСТРУМЕНТЫ ВЕБ-ПОИСКА:
	Тебе доступны инструменты `search_web` (поиск в DuckDuckGo) и `fetch_webpage` (чтение ссылок).
	ПРАВИЛА ИСПОЛЬЗОВАНИЯ:
	1. Вызывай поиск ТОЛЬКО если в тексте есть конкретный неочевидный факт, точное имя или URL-ссылка.
	2. СТРОГИЙ ЛИМИТ: Разрешено делать НЕ БОЛЕЕ ОДНОГО (1) поискового запроса за весь ответ. Запрещено вызывать поиск повторно.
	3. Если поиск не дал результатов или вопрос понятен — сразу пиши перевод/ответ своими словами.
enable_glossary = 1

