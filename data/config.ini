[GENERAL]
autolaunchqtranslate = 1
serverport = 8080
uilanguage = ru
startminimized = 1

[WINDOW]
posx = 195
posy = 89
width = 1436
height = 853

[APPEARANCE]
theme = nord
fontsize = large

[BROWSER]
useportable = 1
cdpport = 9222
autodismisspopups = 1

[SERVICES]
serviceorder = google_ai,deepseek_v4_1_flash,deepseek_v4_pro,qwen_3_8_flash,gemini_family,openai_120b,chatgpt_web,tencent_hy3
activeservice = google_ai

[PRESETS]
google_ai = default
deepseek_flash = default
openai_120b = default
tencent_hy3 = default
qwen_orca = default
deepseek_v4_1_flash = games
deepseek_v4_pro = default
qwen_3_8_flash = default
gemini_family = default
chatgpt_web = default
chatgpt = default
qwen = default
deepl = default

[OCR]
activemodel = medium
autotranslate = 1
hotkey = <ctrl>+<shift>+q
defaultservice = Yandex

[HOTKEYS]
ocr = Alt+W
togglewindow = 
tts = Alt+E

[QTRANSLATE]
summonhotkey = F1
summonmode = double_ctrl

[TTS]
activeprovider = edge_tts
voice = ru-RU-SvetlanaNeural
speed = 1.0
hotkey = <ctrl>+<alt>+s

[DICTIONARY]
enabled = 1
glossaryfile = glossary.txt

[BATCH]
chunksize = 2500
protectcode = 1

[LOGGING]
showconsole = 1
logtofile = 1
clearonstartup = 1
log_api_summary = 1
log_api_payload = 1
log_api_raw_response = 1
log_tools = 1
log_glossary = 1
log_filtering = 1
log_qtranslate = 1
log_browser = 1

[CHAT_WINDOW]
posx = 356
posy = 129
width = 1082
height = 600

